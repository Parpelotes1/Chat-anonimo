/* Skip artifact shell — fixed styles served beside every artifact.
   Tokens, utilities and components (basecoat 1.0 markup, no CDN); artifacts

  color-scheme: light dark;
  --accent: #2563eb;
  --accent-contrast: #ffffff;
  --accent-text: color-mix(in srgb, var(--accent) 72%, #000);
  --bg: #f8f9fb;

  --text: #14171f;

  --success: #0a7a35;
  --danger: #c0262d;
  --warning: #8a5300;

/* Theme resolution. Without data-theme the viewer's system preference decides,
   as it always did. With it, the artifact's own choice wins in BOTH directions:
   a page that hardcodes one palette must not be handed the opposite set of
   tokens by the machine it happens to be opened on. The dark values appear
   twice because a media query cannot be folded into a selector list.
   The attribute sits inside :where() so these blocks keep the specificity of a
   bare :root — the page's own <style> is linked after this file and must go on
   overriding any token it wants, exactly as it could before. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
    --bg: #101318;
    --surface: #181c23;
    --text: #eef1f6;
    --text-muted: #9aa4b2;
    --border: rgba(238, 241, 246, 0.12);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    --success: #4ade80;
    --danger: #f87171;
    --warning: #fbbf24;
  }
}
:root:where([data-theme="dark"]) {
  color-scheme: dark;
  --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
  --bg: #101318;
  --surface: #181c23;
  --text: #eef1f6;
  --text-muted: #9aa4b2;
  --border: rgba(238, 241, 246, 0.12);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  --success: #4ade80;
  --danger: #f87171;
  --warning: #fbbf24;

:root:where([data-theme="light"]) { color-scheme: light; }
/* Pages generated before the shell had its own components still link the
   basecoat CDN, which reads its own tokens and switches theme only on a
   .dark class. Bridged to the shell's, whatever of it those pages use takes
   the page's accent and follows the declared theme. Its --accent token is a
   hover tint, renamed in its theme as --color-accent; the shell's --accent is
   the brand colour, so the tint is derived from it here. */

  --background: var(--bg);
  --foreground: var(--text);
  --card: var(--surface);
  --card-foreground: var(--text);
  --popover: var(--surface);
  --popover-foreground: var(--text);
  --primary: var(--accent);
  --primary-foreground: var(--accent-contrast);
  --secondary: color-mix(in srgb, var(--text) 7%, var(--surface));
  --secondary-foreground: var(--text);
  --muted: color-mix(in srgb, var(--text) 5%, var(--surface));
  --muted-foreground: var(--text-muted);
  --color-accent: color-mix(in srgb, var(--accent) 12%, var(--surface));

  --destructive: var(--danger);
  --input: var(--border);
  --ring: var(--accent);

/* Skip artifact shell — fixed helpers served beside every artifact. */
(function () {
  "use strict";

  var fmt = {
    num: function (v, opts) { return new Intl.NumberFormat("pt-BR", opts || {}).format(v); },

  // axisLabels formats the five y-axis ticks in the unit the chart declared
  // (percent, BRL or plain numbers), compact so long values never clip, with
  // the fewest decimals that still print every tick exactly (1,5 mi, not 2 mi).
  function axisLabels(format, ticks) {
    function at(digits) {
      var opts = { notation: "compact", maximumFractionDigits: digits };

  // the longest one; drawYAxis then draws the grid and the labels.
  function yAxisPad(format, max) {
    var labels = axisLabels(format, [0, max / 4, max / 2, (max * 3) / 4, max]);

  // always the last one (counted back from the end).
  function xLabelStep(labels, step) {
    var longest = labels.reduce(function (m, l) { return Math.max(m, String(l).length); }, 0);

  function categoryLines(text, slot) {

    }
    if (best < 0) return [cut(s)];
    return [cut(s.slice(0, best)), cut(s.slice(best + 1))];
  }
  function legend(el, items) {
    var box = document.createElement("div");
    box.className = "chart-legend";
    items.forEach(function (it) {
      var row = document.createElement("span");
      var dot = document.createElement("i");
      dot.style.background = it.color;
      row.appendChild(dot);
      row.appendChild(document.createTextNode((it.label || "") + (it.value ? " " : "")));
      if (it.value) {
        var v = document.createElement("b");
        v.textContent = it.value;
        row.appendChild(v);
      }
      box.appendChild(row);
    });
    resolve(el).appendChild(box);
  }
  var seriesPalette = ["#1baf7a", "#eda100", "#e34948", "#4a3aa7", "#e87ba4", "#0ea5b7"];

  // format accepts a function OR one of the fmt names ("num" | "brl" | "pct").
  // A page's function may return nothing or throw: the chart prints its
  // number instead of taking the rest of the page script down with it.
  function coerceFormat(spec) {
    if (typeof spec === "function") {
      return function (v) {
        try {
          var out = spec(v);
          return out == null ? "" : String(out);
        } catch (e) {
          return fmt.num(v);
        }
      };
    }
    if (typeof spec === "string" && fmt[spec]) return fmt[spec];
    return function (v) { return fmt.num(v); };
  }

  function accent() {
    return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2563eb";
  }
  function mutedColor() {
    return getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim() || "#5b6472";
  }
  function svgEl(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function frame(el, w, h) {
    var svg = svgEl("svg", { viewBox: "0 0 " + w + " " + h, role: "img" });
    el = resolve(el);
    el.innerHTML = "";
    el.appendChild(svg);
    return svg;
  }

  // maxOf guards the axis scale: empty values would give -Infinity (truthy,
  // so "|| 1" can't catch it) and a non-positive max would flip the chart.
  // finite reads a chart value as a number, 0 when it is not one (NaN,
  // Infinity, a stray string), so one bad value cannot blank the axis.
  function finite(v) {
    var n = +v;
    return isFinite(n) ? n : 0;
  }

  function maxOf(values) {
    var m = values.length ? Math.max.apply(null, values.map(finite)) : 0;
    return m > 0 ? m : 1;
  }

  // labelsFor pads or trims the category names to the n points drawn: pages
  // pass labels and values of different lengths, and one throw here loses
  // every section the page renders after the chart.
  function labelsFor(cfg, n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(cfg.labels && cfg.labels[i] != null ? String(cfg.labels[i]) : "");
    return out;
  }

  // niceMax rounds the scale up so the four grid steps land on round values
  // (1, 1.5, 2, 2.5, 3, 4, 5, 6 or 8 × 10^k) and the tick labels read exactly.
  function niceMax(max) {
    var raw = max / 4;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var res = raw / mag;
    var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    var nice = steps.filter(function (s) { return s >= res - 1e-9; })[0];
    return nice * mag * 4;
  }

  // bar(el, {labels:[], values:[], color?, format?}) — vertical bar chart.
  function bar(el, cfg) {
    var W = 640, H = 280, padB = 30, padT = 12, padR = 12;
    var max = niceMax(maxOf(cfg.values));
    var axis = yAxisPad(cfg.format, max);
    var svg = frame(el, W, H);
    var n = cfg.values.length;
    var labels = labelsFor(cfg, n);
    var plotW = W - axis.padL - padR;
    var step = plotW / n, bw = Math.min(step * 0.62, 64);
    var names = labels.map(function (l) { return categoryLines(l, step); });
    var named = names.every(Boolean);
    if (named && names.some(function (l) { return l.length > 1; })) padB = 42;
    var plotH = H - padT - padB;
    var color = cfg.color || accent();
    var f = coerceFormat(cfg.format);
    var every = xLabelStep(labels, step);
    drawYAxis(svg, axis, W, padR, padT, plotH);
    cfg.values.forEach(function (v, i) {
      var bh = Math.max(0, (finite(v) / max) * plotH);
      var x = axis.padL + i * step + (step - bw) / 2;
      var y = padT + plotH - bh;
      var r = svgEl("rect", { x: x, y: y, width: bw, height: bh, rx: 4, fill: (cfg.colors && cfg.colors[i]) || color });
      var t = svgEl("title", {});
      t.textContent = labels[i] + ": " + f(v);
      r.appendChild(t);
      svg.appendChild(r);
      if (named) {
        names[i].forEach(function (text, li) {
          drawXLabel(svg, text, x + bw / 2, padT + plotH + 18 + li * 13, W, false);
        });
      } else if ((n - 1 - i) % every === 0) {
        drawXLabel(svg, labels[i], x + bw / 2, H - 10, W, false);
      }
    });
  }

  // line(el, {labels:[], values:[] | series:[{label, values, color?}], color?, format?})
  // — one line, or several series on one scale with a legend under the chart.
  function line(el, cfg) {
    var W = 640, H = 280, padB = 30, padT = 12, padR = 16;
    var series = cfg.series && cfg.series.length
      ? cfg.series
      : [{ label: "", values: cfg.values || [], color: cfg.color }];
    var all = [];
    series.forEach(function (s) { all = all.concat(s.values || []); });
    var max = niceMax(maxOf(all));
    var axis = yAxisPad(cfg.format, max);
    var svg = frame(el, W, H);
    var n = series.reduce(function (m, s) { return Math.max(m, (s.values || []).length); }, 0);
    var labels = labelsFor(cfg, n);
    var plotW = W - axis.padL - padR, plotH = H - padT - padB;
    var f = coerceFormat(cfg.format);
    drawYAxis(svg, axis, W, padR, padT, plotH);
    var xs = labels.map(function (_, i) { return axis.padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1)); });
    var every = xLabelStep(labels, n > 1 ? plotW / (n - 1) : plotW);
    labels.forEach(function (label, i) {
      if ((n - 1 - i) % every === 0) drawXLabel(svg, label, xs[i], H - 10, W, true);
    });
    var colors = series.map(function (s, si) {
      return s.color || (si === 0 ? (cfg.color || accent()) : seriesPalette[(si - 1) % seriesPalette.length]);
    });
    series.forEach(function (s, si) {
      var color = colors[si];
      var pts = (s.values || []).map(function (v, i) { return [xs[i], padT + plotH - (finite(v) / max) * plotH]; });
      var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
      svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
      pts.forEach(function (p, i) {
        var c = svgEl("circle", { cx: p[0], cy: p[1], r: 3.5, fill: color });
        var t = svgEl("title", {});
        t.textContent = (s.label ? s.label + " · " : "") + labels[i] + ": " + f(s.values[i]);
        c.appendChild(t);
        svg.appendChild(c);
      });
    });
    if (series.length > 1) {
      legend(el, series.map(function (s, si) { return { label: s.label, color: colors[si] }; }));
    }
  }

  // donut(el, {labels:[], values:[], colors?, format?, center?, centerLabel?, legend?})
  // — donut with a short total in the centre (compact, in the declared unit)
  // and, with legend: true, the labels and shares listed under it.
  function donut(el, cfg) {
    var W = 320, H = 280, cx = W / 2, cy = H / 2, R = 92, r = 58;
    var svg = frame(el, W, H);
    // At 100% of a wide container the donut outgrows the height pages give
    // the box and spills over the next section: keep it at its own size.
    svg.style.maxWidth = W + "px";
    svg.style.margin = "0 auto";
    var values = cfg.values.map(finite);
    var labels = labelsFor(cfg, values.length);
    var sum = values.reduce(function (a, b) { return a + b; }, 0);
    var total = sum || 1;
    var palette = cfg.colors || [accent()].concat(seriesPalette);
    // The hover keeps the full value; the centre has room for a short one.
    var full = coerceFormat(cfg.format);
    var short = typeof cfg.format === "function" ? full : cfg.format === "brl" ? fmt.brlCompact : fmt.compact;
    var a0 = -Math.PI / 2;
    values.forEach(function (v, i) {
      var a1 = a0 + (v / total) * Math.PI * 2;
      var large = a1 - a0 > Math.PI ? 1 : 0;
      var p = ["M", cx + R * Math.cos(a0), cy + R * Math.sin(a0),
        "A", R, R, 0, large, 1, cx + R * Math.cos(a1), cy + R * Math.sin(a1),
        "L", cx + r * Math.cos(a1), cy + r * Math.sin(a1),
        "A", r, r, 0, large, 0, cx + r * Math.cos(a0), cy + r * Math.sin(a0), "Z"].join(" ");
      var path = svgEl("path", { d: p, fill: palette[i % palette.length] });
      var t = svgEl("title", {});
      t.textContent = labels[i] + ": " + full(v) + " (" + fmt.pct(v / total) + ")";
      path.appendChild(t);
      svg.appendChild(path);
      a0 = a1;
    });
    // A share chart has no total worth printing: without its own centre text
    // the caption alone takes the middle.
    var text = cfg.center != null ? String(cfg.center) : (cfg.format === "pct" ? "" : short(sum));
    if (text) {
      var size = text.length > 9 ? 14 : text.length > 7 ? 17 : 20;
      var center = svgEl("text", { x: cx, y: cfg.centerLabel ? cy + 1 : cy + 6, "text-anchor": "middle", "font-size": size, "font-weight": 650, fill: "currentColor" });
      center.textContent = text;
      svg.appendChild(center);
    }
    if (cfg.centerLabel) {
      var cap = svgEl("text", { x: cx, y: text ? cy + 19 : cy + 5, "text-anchor": "middle", "font-size": 11, fill: mutedColor() });
      cap.textContent = cfg.centerLabel;
      svg.appendChild(cap);
    }
    if (cfg.legend) {
      legend(el, labels.map(function (label, i) {
        return { label: label, color: palette[i % palette.length], value: fmt.pct(values[i] / total) };
      }));
    }
  }

  // ---- Page building blocks: what dashboards and small systems kept
  // re-implementing — a searchable sortable table, a KPI row, tabs, toasts,
  // dialogs, saved state and mock data. Every call is opt-in, so a page that
  // brings its own versions keeps them.

  function resolve(target) {
    return typeof target === "string" ? document.querySelector(target) : target;
  }

  function node(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text != null) el.textContent = text;
    return el;
  }

  function isNumberColumn(col) {
    return col.align === "right" || col.format === "num" || col.format === "brl" || col.format === "pct";
  }

  function cellText(col, row) {
    var value = row[col.key];
    if (value == null) return "";
    return col.format ? coerceFormat(col.format)(value) : String(value);
  }

  function compareValues(a, b) {
    if (typeof a === "number" && typeof b === "number") return a - b;
    return String(a == null ? "" : a).localeCompare(String(b == null ? "" : b), "pt-BR", { numeric: true });
  }

  // table(el, {columns, rows, search?, pageSize?, empty?, onRowClick?}) — a
  // table.shell-table with sortable headers, an optional search box and
  // pager. A column is {key, label, format?, align?, sortable? (true),
  // render?(value, row) returning a Node or an HTML string — the page writes
  // its cell templates as markup}. Plain values are always set as text.
  // Returns {setRows, rows}.
  function table(target, cfg) {
    var root = resolve(target);
    var cols = cfg.columns || [];
    var pageSize = cfg.pageSize || 0;
    var state = { rows: (cfg.rows || []).slice(), query: "", key: null, dir: 1, page: 0 };
    root.innerHTML = "";
    if (cfg.search) {
      var search = node("input", "input skip-table-search");
      search.type = "search";
      search.placeholder = typeof cfg.search === "string" ? cfg.search : "Buscar…";
      search.setAttribute("aria-label", search.placeholder);
      search.addEventListener("input", function () {
        state.query = search.value.trim().toLowerCase();
        state.page = 0;
        draw();
      });
      root.appendChild(search);
    }
    var tableEl = node("table", "shell-table");
    var headRow = node("tr");
    var heads = cols.map(function (col) {
      var th = node("th", isNumberColumn(col) ? "num" : "", col.label == null ? col.key : col.label);
      th.scope = "col";
      if (col.sortable !== false) {
        var toggle = function () {
          state.dir = state.key === col.key ? -state.dir : 1;
          state.key = col.key;
          draw();
        };
        th.setAttribute("data-sort", col.key);
        th.tabIndex = 0;
        th.addEventListener("click", toggle);
        th.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });
      }
      headRow.appendChild(th);
      return th;
    });
    var thead = node("thead");
    var tbody = node("tbody");
    var wrap = node("div", "skip-table-wrap");
    var pager = node("div", "skip-pager");
    thead.appendChild(headRow);
    tableEl.appendChild(thead);
    tableEl.appendChild(tbody);
    wrap.appendChild(tableEl);
    root.appendChild(wrap);
    if (pageSize) root.appendChild(pager);

    function visibleRows() {
      var rows = state.rows;
      if (state.query) {
        rows = rows.filter(function (row) {
          return cols.some(function (col) { return cellText(col, row).toLowerCase().indexOf(state.query) >= 0; });
        });
      }
      if (state.key) {
        var key = state.key, dir = state.dir;
        rows = rows.slice().sort(function (a, b) { return dir * compareValues(a[key], b[key]); });
      }
      return rows;
    }

    function drawRow(row) {
      var tr = node("tr");
      cols.forEach(function (col) {
        var td = node("td", isNumberColumn(col) ? "num" : "");
        if (!col.render) {
          td.textContent = cellText(col, row);
        } else {
          var content = col.render(row[col.key], row);
          if (content instanceof Node) td.appendChild(content);
          else td.innerHTML = content == null ? "" : String(content);
        }
        tr.appendChild(td);
      });
      // The row stays a row (no role) and takes focus, so a keyboard reaches
      // the same action; keys pressed on a control inside a cell are its own.
      if (cfg.onRowClick) {
        tr.style.cursor = "pointer";
        tr.tabIndex = 0;
        tr.addEventListener("click", function () { cfg.onRowClick(row); });
        tr.addEventListener("keydown", function (e) {
          if (e.target !== tr || (e.key !== "Enter" && e.key !== " ")) return;
          e.preventDefault();
          cfg.onRowClick(row);
        });
      }
      return tr;
    }

    function pagerButton(label, disabled, step) {
      var button = node("button", "btn", label);
      button.type = "button";
      button.setAttribute("data-variant", "outline");
      button.setAttribute("data-size", "sm");
      button.disabled = disabled;
      button.addEventListener("click", function () { state.page += step; draw(); });
      return button;
    }

    function draw() {
      var rows = visibleRows();
      heads.forEach(function (th, i) {
        if (cols[i].key === state.key) th.setAttribute("aria-sort", state.dir > 0 ? "ascending" : "descending");
        else th.removeAttribute("aria-sort");
      });
      var pages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      state.page = Math.min(state.page, pages - 1);
      var shown = pageSize ? rows.slice(state.page * pageSize, (state.page + 1) * pageSize) : rows;
      tbody.innerHTML = "";
      if (!shown.length) {
        var empty = node("td", "skip-table-empty", cfg.empty || "Nenhum registro encontrado.");
        empty.colSpan = cols.length;
        tbody.appendChild(node("tr")).appendChild(empty);
      }
      shown.forEach(function (row) { tbody.appendChild(drawRow(row)); });
      if (!pageSize) return;
      pager.innerHTML = "";
      var from = rows.length ? state.page * pageSize + 1 : 0;
      pager.appendChild(node("span", "", from + "–" + Math.min(rows.length, (state.page + 1) * pageSize) + " de " + rows.length));
      var nav = node("div", "row gap-2");
      nav.appendChild(pagerButton("Anterior", state.page === 0, -1));
      nav.appendChild(pagerButton("Próxima", state.page >= pages - 1, 1));
      pager.appendChild(nav);
    }

    draw();
    return {
      setRows: function (rows) { state.rows = rows.slice(); draw(); },
      rows: visibleRows
    };
  }

  // kpis(el, [{label, value, format?, delta?, hint?}]) — KPI cards in a
  // responsive grid; delta is a fraction (0.12 renders as ▲ 12%).
  function kpis(target, items) {
    var root = resolve(target);
    root.innerHTML = "";
    root.classList.add("shell-grid");
    items.forEach(function (item) {
      var card = node("div", "panel kpi");
      card.appendChild(node("span", "kpi-label", item.label));
      // Large money values go compact ("R$ 27,5 mi"): the full amount does
      // not fit a KPI card at four per row.
      var kpiFormat = item.format === "brl" && Math.abs(item.value) >= 1e6 ? fmt.brlCompact : (item.format ? coerceFormat(item.format) : null);
      card.appendChild(node("span", "kpi-value", kpiFormat ? kpiFormat(item.value) : String(item.value)));
      if (typeof item.delta === "number") {
        var up = item.delta >= 0;
        card.appendChild(node("span", "kpi-delta " + (up ? "up" : "down"), (up ? "▲ " : "▼ ") + fmt.pct(Math.abs(item.delta))));
      }
      if (item.hint) card.appendChild(node("span", "kpi-label", item.hint));
      root.appendChild(card);
    });
  }

  // badge(text, variant?) — a .badge node for table cells and lists;
  // variant is "secondary" | "outline" | "destructive" (default: primary).
  function badge(text, variant) {
    var el = node("span", "badge", text);
    if (variant) el.setAttribute("data-variant", variant);
    return el;
  }

  // tabs(el) — wires one .tabs block: [role=tab] buttons inside
  // [role=tablist], each with aria-controls naming its [role=tabpanel].
  function tabs(target) {
    var root = resolve(target);
    var buttons = Array.prototype.slice.call(root.querySelectorAll('[role="tab"]'));
    function select(chosen) {
      buttons.forEach(function (b) {
        var on = b === chosen;
        b.setAttribute("aria-selected", on ? "true" : "false");
        b.tabIndex = on ? 0 : -1;
        var panel = document.getElementById(b.getAttribute("aria-controls"));
        if (panel) panel.hidden = !on;
      });
    }
    buttons.forEach(function (b, i) {
      b.addEventListener("click", function () { select(b); });
      b.addEventListener("keydown", function (e) {
        var step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!step) return;
        var next = buttons[(i + step + buttons.length) % buttons.length];
        next.focus();
        select(next);
      });
    });
    select(buttons.filter(function (b) { return b.getAttribute("aria-selected") === "true"; })[0] || buttons[0]);
  }

  // toast(message, {type?: "success" | "error", title?, duration?}) — a
  // .toast in a shared .toaster at the bottom of the page.
  function toast(message, opts) {
    opts = opts || {};
    var toaster = document.querySelector(".toaster") || document.body.appendChild(node("div", "toaster"));
    var item = node("div", "toast");
    item.setAttribute("role", opts.type === "error" ? "alert" : "status");
    item.setAttribute("aria-hidden", "true");
    if (opts.type) item.setAttribute("data-type", opts.type);
    var content = node("div", "toast-content");
    var section = node("section");
    if (opts.title) section.appendChild(node("h2", "", opts.title));
    section.appendChild(node("p", "", message));
    content.appendChild(section);
    item.appendChild(content);
    toaster.appendChild(item);
    requestAnimationFrame(function () { item.setAttribute("aria-hidden", "false"); });
    setTimeout(function () {
      item.setAttribute("aria-hidden", "true");
      setTimeout(function () { item.remove(); }, 400);
    }, opts.duration || 3000);
  }

  // Dialogs are native <dialog class="dialog">: a [data-dialog-open="id"]
  // anywhere opens one, a [data-dialog-close] inside closes it, and a click on
  // its backdrop closes it too. Plain dialog.showModal()/close() still work.
  document.addEventListener("click", function (e) {
    var target = e.target;
    if (!(target instanceof Element)) return;
    var opener = target.closest("[data-dialog-open]");
    if (opener) {
      var dialog = document.getElementById(opener.getAttribute("data-dialog-open"));
      if (dialog && dialog.showModal && !dialog.open) dialog.showModal();
      return;
    }
    var closer = target.closest("[data-dialog-close]");
    if (closer && closer.closest("dialog")) {
      closer.closest("dialog").close();
      return;
    }
    if (target.tagName === "DIALOG" && target.classList.contains("dialog") && target.open) target.close();
  });

  // store(key, fallback) — JSON state in localStorage that never throws (a
  // private window or a full quota falls back to memory): {get, set, update}.
  function store(key, fallback) {
    var memory;
    // Set while the last write did not reach localStorage: what is stored
    // there is older than memory until a write goes through again.
    var unsaved = false;
    var initial = function () { return fallback === undefined ? undefined : JSON.parse(JSON.stringify(fallback)); };
    function get() {
      if (!unsaved) {
        try {
          var raw = localStorage.getItem(key);
          if (raw != null) return JSON.parse(raw);
        } catch (e) { /* storage unavailable: memory below */ }
      }
      return memory !== undefined ? memory : initial();
    }
    function set(value) {
      memory = value;
      try {
        localStorage.setItem(key, JSON.stringify(value));
        unsaved = false;
      } catch (e) {
        unsaved = true;
      }
      return value;
    }
    return { get: get, set: set, update: function (fn) { return set(fn(get())); } };
  }

  // mock — seeded random data, so a page asks for 90 days of numbers in one
  // line instead of writing them out; the same seed gives the same data.
  var FIRST = ["Ana", "Bruno", "Carla", "Diego", "Eduarda", "Felipe", "Gabriela", "Henrique", "Isabela", "João",
    "Larissa", "Marcos", "Natália", "Otávio", "Paula", "Rafael", "Sofia", "Thiago", "Vanessa", "Lucas"];
  var LAST = ["Silva", "Santos", "Oliveira", "Souza", "Pereira", "Costa", "Rodrigues", "Almeida", "Nascimento", "Lima",
    "Araújo", "Fernandes", "Carvalho", "Gomes", "Martins", "Rocha", "Ribeiro", "Barbosa"];
  var INITIALS = "ABCDEFGHIJLMNOPRSTV".split("");
  var CITIES = ["São Paulo, SP", "Rio de Janeiro, RJ", "Belo Horizonte, MG", "Curitiba, PR", "Porto Alegre, RS",
    "Salvador, BA", "Recife, PE", "Fortaleza, CE", "Brasília, DF", "Goiânia, GO", "Campinas, SP", "Florianópolis, SC",
    "Manaus, AM", "Belém, PA", "Vitória, ES", "Natal, RN"];

  function createMock(seed) {
    var state = seed >>> 0;
    var names = 0;
    function random() {
      state = (state + 0x6d2b79f5) >>> 0;
      var t = state;

  box-shadow: 0 0 60px rgba(124,58,237,0.35), inset 0 0 60px rgba(34,211,238,0.08);
  perspective: 1400px; overflow: hidden; text-align: center;
}
[data-theme="light"] .tv-screen { background: radial-gradient(ellipse at center, rgba(124,58,237,0.12), rgba(255,255,255,0.8) 70%); }
.tv-stage { width: 100%; transform-style: preserve-3d; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tv-text {
  font-size: clamp(2rem, 7.5vw, 8rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.03em;
  max-width: 24ch; margin: 0 auto; word-break: break-word; white-space: pre-wrap; color: var(--ink);
  text-shadow: 0 0 18px rgba(124,58,237,0.45), 0 0 4px rgba(34,211,238,0.35);
  transform-style: preserve-3d; transition: transform 0.7s var(--ease-out), opacity 0.6s var(--ease-out), filter 0.6s;
}
.tv-text.out { transform: translateZ(-300px) scale(0.6); opacity: 0; filter: blur(6px); }
.tv-text.in-front { animation: tv-in 0.9s var(--ease-spring) both; }
@keyframes tv-in {
  0% { transform: translateZ(-400px) scale(0.5); opacity: 0; filter: blur(8px); }
  70% { transform: translateZ(40px) scale(1.04); opacity: 1; filter: blur(0); }
  100% { transform: translateZ(0) scale(1); opacity: 1; }
}
.tv-meta { margin-top: 22px; font-size: clamp(0.85rem, 1.6vw, 1.05rem); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.tv-empty { color: var(--ink-muted); font-size: 1.2rem; }

/* ---------- Responsivo ---------- */
@media (max-width: 860px) {
.stage { flex-direction: column; padding: 12px; }
.mural { grid-template-columns: 1fr; }
  .send-row { flex-direction: column; align-items: stretch; }
  .btn-send { height: 48px; width: 100%; }
  .topbar { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .shape, .t3d .char.emoji { animation: none !important; }
}
</style>
</head>
<body>
<div id="theme-bg-dark" aria-hidden="true"></div>
<div id="theme-bg-light" aria-hidden="true"></div>
<div id="scene-bg" aria-hidden="true">
  <div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<header class="topbar">
  <a class="logo" href="#" aria-label="Comentario Anonimo — início">
    <svg class="logo-svg" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7C3AED"/>
          <stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
      </defs>
      <g class="glow" fill="none" stroke="url(#lg)" stroke-width="1.6" stroke-linejoin="round">
        <path d="M8 10 H40 V31 H22 L14 39 V31 H8 Z"/>
        <path d="M15 18 H33 M15 24 H28" stroke-linecap="round"/>
      </g>
      <g fill="url(#lg)">
        <circle cx="44" cy="8" r="1.4"/><circle cx="46" cy="14" r="1"/><circle cx="42" cy="3" r="0.8"/>
      </g>
    </svg>
    <span class="wordmark">Comentario Anonimo</span>
  </a>

  <div class="mode-switch" role="group" aria-label="Modo de visualização">
    <button type="button" id="btnModoChat" aria-pressed="true">Chat</button>
    <button type="button" id="btnModoTV" aria-pressed="false">Televisão</button>
  </div>

  <button type="button" class="theme-toggle" id="btnTema" aria-label="Alternar tema claro/escuro" title="Alternar tema">
    <span id="iconeTema" aria-hidden="true">☾</span>
  </button>
</header>

<main class="stage">
  <section class="mural-wrap" aria-label="Mural de comentários">
    <div class="mural-head">
      <div>
        <div class="t3d t3d-title" data-3d="Mural aberto">Mural aberto</div>
        <p class="mural-sub">Qualquer pessoa escreve, todos leem. Nada é apagado.</p>
      </div>
      <div class="row gap-2" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span class="pill"><span class="dot"></span> Ao vivo</span>
        <span class="pill pill-cyan">Total: <span class="counter-num" id="contador">0</span> comentários</span>
      </div>
    </div>
    <div class="mural" id="mural" role="log" aria-live="polite" aria-relevant="additions"></div>

    <div class="tv-screen" id="tvScreen" aria-live="polite">
      <div class="tv-stage" id="tvStage">
        <p class="tv-text" id="tvText"></p>
        <p class="tv-meta" id="tvMeta"></p>
      </div>
    </div>
    <button type="button" class="tv-toggle" id="btnTvConfig" aria-label="Configurações da TV" aria-expanded="false" aria-controls="tvPanel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </section>

  <div class="tv-scrim" id="tvScrim"></div>
  <aside class="tv-panel" id="tvPanel" aria-label="Configurações da TV" aria-hidden="true">
    <div class="tv-panel-head">
      <h2>Configurações da TV</h2>
      <button type="button" class="tv-close" id="btnTvFechar" aria-label="Fechar configurações">✕</button>
    </div>
    <div class="tv-controls">
      <label for="delaySlider">Delay entre comentários</label>
      <input type="range" id="delaySlider" min="0" max="10" step="1" value="0" aria-describedby="delayValor">
      <p class="tv-caption" id="delayValor">Atual: Instantâneo</p>
    </div>
    <div class="tv-controls">
      <label for="velocidadeSelect">Velocidade de exibição</label>
      <select id="velocidadeSelect" aria-label="Velocidade">
        <option value="0">Instantâneo</option>
        <option value="2">2 segundos</option>
        <option value="4">4 segundos</option>
        <option value="6">6 segundos</option>
        <option value="8">8 segundos</option>
        <option value="10">10 segundos</option>
      </select>
    </div>
    <div>
      <span class="pill queue-badge">Na fila: <span id="filaCount">0</span></span>
      <p class="tv-caption">Os comentários aparecem em ordem, um a um, sem pular nenhum.</p>
    </div>
  </aside>
</main>

<footer class="send-dock" id="sendDock">
  <form class="send-form" id="formEnvio" novalidate>
    <div class="send-row">
      <div class="field-wrap">
        <textarea id="campoTexto" maxlength="500" rows="2" placeholder="Escreva algo que todos vão ler… sem nome, sem rosto." aria-label="Texto do comentário anônimo" aria-describedby="ajudaTexto"></textarea>
      </div>
      <button type="submit" class="btn-send" id="btnEnviar" disabled aria-label="Enviar comentário anônimo">
        ENVIAR
        <span class="explosion" id="explosao" aria-hidden="true"></span>
      </button>
    </div>
    <div class="helper" id="ajudaTexto">
      <span>Anônimo total. Data e horário são guardados.</span>
      <span class="char-count" id="contadorChars">0 / 500</span>
    </div>
  </form>
</footer>

<script>
/* =========================================================
   CAMADA DE DADOS
   Troque apenas as URLs abaixo para apontar ao backend real.
   GET  -> lista de comentários   (resposta: [{id, texto, criado_em}])
   POST -> cria comentário        (corpo: {texto})
   ========================================================= */
const ROTAS = {
  listar: '/api/comentarios',
  criar: '/api/comentarios'
};

const DADOS = {
  async listar() {
    try {
      const r = await fetch(ROTAS.listar, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('falha');
      const corpo = await r.json();
      // O Worker responde { ok: true, comentarios: [...] }
      if (corpo && Array.isArray(corpo.comentarios)) return corpo.comentarios;
      // fallback: se algum dia a API devolver array puro
      if (Array.isArray(corpo)) return corpo;
      return [];
    } catch (e) {
      return null;
    }
  },

  async criar(texto) {
    try {
      const r = await fetch(ROTAS.criar, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ texto })
      });
      if (!r.ok) throw new Error('falha');
      const corpo = await r.json();
      // O Worker responde { ok: true, comentario: {...} }
      if (corpo && corpo.comentario) return corpo.comentario;
      if (corpo && corpo.ok === false) return null;
      return corpo;
    } catch (e) {
      return null;
    }
  }
};
/* ===================== FIM CAMADA DE DADOS ===================== */

const COMENTARIOS_DEMO = []

/* ===================== ESTADO ===================== */
const estado = {
  comentarios: [],
  ids: new Set(),
  modo: 'chat',
  fila: [],
  tvAtual: null,
  tvTimer: null,
  delaySeg: 0,
  tvBusy: false
};

const $ = (s) => document.querySelector(s);
const mural = $('#mural');
const campo = $('#campoTexto');
const btnEnviar = $('#btnEnviar');
const reduzMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const contadorEl = $('#contador');
const contadorChars = $('#contadorChars');

/* ===================== UTILIDADES ===================== */
function formatarData(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '--/--/---- às --:--';
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} às ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Gera letras 3D: cada caractere com camadas (extrude) e translateZ por camada
const EMOJI_RE = /\p{Extended_Pictographic}/u;
function t3dHtml(texto, camadas = 4, profundidade = 3) {
  const chars = Array.from(texto);
  let html = '';
  chars.forEach((ch, i) => {
    const isEmoji = EMOJI_RE.test(ch);
    const delay = (i * 0.07).toFixed(2);
    let layers = '';
    for (let k = 1; k <= camadas; k++) {
      const z = -(k * profundidade);
      layers += `<span class="layer" aria-hidden="true" style="transform:translateZ(${z}px);opacity:${(0.5 - k * 0.08).toFixed(2)};color:var(--accent-text)">${escapeHtml(ch)}</span>`;
    }
    html += `<span class="char${isEmoji ? ' emoji' : ''}" style="transform:translateZ(${(i % 3) * 2}px);animation-delay:${isEmoji ? delay + 's' : '0s'}">${layers}<span class="layer-front" style="position:relative;transform:translateZ(0)">${escapeHtml(ch)}</span></span>`;
  });
  return `<span class="t3d-texto" aria-label="${escapeHtml(texto)}">${html}</span>`;
}
function renderTitulos3D() {
  document.querySelectorAll('[data-3d]').forEach((el) => {
    el.innerHTML = t3dHtml(el.dataset['3d'], 3, 2);
  });
}

/* ===================== RENDER CHAT ===================== */
function criarCard(c, novo) {
  const art = document.createElement('article');
  art.className = 'card' + (novo ? ' new' : '');
  art.dataset.id = c.id;
  art.innerHTML = `
    <p class="card-text">${escapeHtml(c.texto)}</p>
    <div class="card-meta">
      <span>Anônimo</span>
      <time datetime="${escapeHtml(c.criado_em)}">${formatarData(c.criado_em)}</time>
    </div>`;
  art.addEventListener('mousemove', (e) => {
    const r = art.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    art.style.transform = `perspective(900px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg) translateY(-3px)`;
  });
  art.addEventListener('mouseleave', () => { art.style.transform = ''; });
  return art;
}
function adicionarAoMural(c, novo) {
  if (estado.ids.has(c.id)) return;
  estado.ids.add(c.id);
  estado.comentarios.push(c);
  mural.appendChild(criarCard(c, novo));
  if (novo) mural.scrollTo({ top: mural.scrollHeight, behavior: 'smooth' });
  atualizarContador();
}
function atualizarContador() {
  contadorEl.textContent = estado.comentarios.length;
  contadorEl.classList.add('bump');
  setTimeout(() => contadorEl.classList.remove('bump'), 300);
}
function renderMuralCompleto() {
  mural.innerHTML = '';
  estado.comentarios.sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
  estado.comentarios.forEach((c) => {
    const art = criarCard(c, false);
    mural.appendChild(art);
  });
  atualizarContador();
}

/* ===================== MODO TV ===================== */
function enfileirar(c) {
  if (estado.ids.has(c.id) && estado.tvAtual === c.id) return;
  if (estado.fila.some((f) => f.id === c.id)) return;
  estado.fila.push(c);
  atualizarFila();
  if (estado.modo === 'tv' && !estado.tvBusy) proximoTV();
}
function atualizarFila() {
  $('#filaCount').textContent = estado.fila.length;
}
function mostrarNaTV(c) {
  const txt = $('#tvText');
  const meta = $('#tvMeta');
  txt.classList.remove('in-front', 'out', 'tv-empty');
  txt.textContent = c.texto;
  meta.textContent = formatarData(c.criado_em);
  void txt.offsetWidth;
  txt.classList.add('in-front');
  estado.tvAtual = c.id;
}
function proximoTV() {
  if (estado.modo !== 'tv') return;
  if (estado.fila.length === 0) {
    estado.tvBusy = false;
    if (!estado.tvAtual) {
      $('#tvText').textContent = 'Aguardando o primeiro comentário…';
      $('#tvText').classList.add('tv-empty');
      $('#tvMeta').textContent = '';
    }
    return;
  }
  estado.tvBusy = true;
  const txt = $('#tvText');
  if (estado.tvAtual) {
    txt.classList.add('out');
  }
  const cmd = () => {
    const prox = estado.fila.shift();
    atualizarFila();
    mostrarNaTV(prox);
    const espera = estado.delaySeg === 0 ? 0 : estado.delaySeg * 1000;
    clearTimeout(estado.tvTimer);
    estado.tvTimer = setTimeout(() => {
      estado.tvBusy = false;
      if (estado.fila.length) proximoTV();
    }, Math.max(espera, 900) + 900);
  };
  if (estado.tvAtual) setTimeout(() => { cmd(); }, 620);
  else cmd();
}

/* ===================== MODO ===================== */
function setModo(modo) {
  estado.modo = modo;
  document.body.classList.toggle('tv-mode', modo === 'tv');
  $('#btnModoChat').setAttribute('aria-pressed', modo === 'chat');
  $('#btnModoTV').setAttribute('aria-pressed', modo === 'tv');
  $('#sendDock').classList.toggle('compact', modo === 'tv');
  if (modo === 'tv') {
    estado.tvAtual = null;
    estado.tvBusy = false;
    const pend = estado.comentarios.filter((c) => !estado.fila.some((f) => f.id === c.id));
    estado.fila = [...estado.fila];
    if (!estado.tvAtual) proximoTV();
  } else {
    clearTimeout(estado.tvTimer);
    estado.tvBusy = false;
    mural.scrollTop = mural.scrollHeight;
  }
  try { localStorage.setItem('ca_modo', modo); } catch (e) {}
}

/* ===================== ENVIO ===================== */
function atualizarBotao() {
  const v = campo.value.trim();
  btnEnviar.disabled = v.length === 0;
  const len = campo.value.length;
  contadorChars.textContent = `${len} / 500`;
  contadorChars.classList.toggle('warn', len > 450);
}
function explodir() {
  const ex = $('#explosao');
  ex.innerHTML = '';
  const ring = document.createElement('span');
  ring.className = 'ring';
  ex.appendChild(ring);
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.setProperty('--a', `${i * 30}deg`);
    ex.appendChild(s);
  }
  setTimeout(() => { ex.innerHTML = ''; }, 650);
  btnEnviar.classList.remove('squash');
  void btnEnviar.offsetWidth;
  btnEnviar.classList.add('squash');
}
async function enviar(e) {
  e.preventDefault();
  const texto = campo.value.trim();
  if (!texto) return;
  explodir();
  const otimista = { id: 'tmp-' + Date.now(), texto, criado_em: new Date().toISOString() };
  adicionarAoMural(otimista, true);
  enfileirar(otimista);
  campo.value = '';
  atualizarBotao();
  const salvo = await DADOS.criar(texto);
  if (salvo && salvo.id) {
    estado.ids.delete(otimista.id);
    const idx = estado.comentarios.findIndex((c) => c.id === otimista.id);
    if (idx >= 0) estado.comentarios[idx] = salvo;
    estado.ids.add(salvo.id);
    const card = mural.querySelector(`[data-id="${otimista.id}"]`);
    if (card) card.dataset.id = salvo.id;
  }
  window.skipUI && window.skipUI.toast('Comentário enviado ao mural.', { type: 'success' });
}

/* ===================== POLLING ===================== */
async function sincronizar(primeira) {
  const lista = await DADOS.listar();
  if (lista === null) {
    if (primeira) {
      COMENTARIOS_DEMO.forEach((c) => adicionarAoMural(c, false));
    }
    return;
  }
  const novos = lista.filter((c) => !estado.ids.has(c.id));
  if (primeira && lista.length === 0) {
    COMENTARIOS_DEMO.forEach((c) => adicionarAoMural(c, false));
    return;
  }
  novos.forEach((c) => {
    adicionarAoMural(c, !primeira);
    if (!primeira) enfileirar(c);
  });
}

/* ===================== TEMA ===================== */
function aplicarTema(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#iconeTema').textContent = t === 'dark' ? '☾' : '☀';
  try { localStorage.setItem('ca_tema', t); } catch (e) {}
}
function animarTrocaTema(novo) {
  const overlay = document.createElement('div');
  overlay.className = 'sun-moon-overlay' + (novo === 'dark' ? ' moon' : '');
  const corpo = document.createElement('div');
  corpo.className = 'sun-moon ' + (novo === 'dark' ? 'moon' : 'sun');
  if (novo !== 'dark') {
    for (let i = 0; i < 12; i++) {
      const r = document.createElement('span');
      r.className = 'ray';
      r.style.setProperty('--a', `${i * 30}deg`);
      corpo.appendChild(r);
    }
  }
  overlay.appendChild(corpo);
  if (!reduzMovimento) {
    const anel = document.createElement('span');
    anel.className = 'sun-moon-ring';
    overlay.appendChild(anel);
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('span');
      p.className = 'sun-moon-particle';
      const ang = (i / 16) * Math.PI * 2;
      const dist = 160 + (i % 3) * 30;
      p.style.setProperty('--px', `${Math.cos(ang) * dist}px`);
      p.style.setProperty('--py', `${Math.sin(ang) * dist}px`);
      overlay.appendChild(p);
    }
  }
  document.body.appendChild(overlay);
  const duracao = reduzMovimento ? 200 : 1000;
  setTimeout(() => { overlay.remove(); }, duracao + 300);
}
function temaInicial() {
  try {
    const s = localStorage.getItem('ca_tema');
    if (s) return s;
  } catch (e) {}
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

/* ===================== FUNDO PARALAXE ===================== */
function paralaxeFundo() {
  const shapes = document.querySelectorAll('.shape');
  window.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5);
    const y = (e.clientY / window.innerHeight - 0.5);
    shapes.forEach((s, i) => {
      const f = (i + 1) * 12;
      s.style.transform = `translate3d(${x * f}px, ${y * f}px, ${(i % 2 ? 1 : -1) * 20}px)`;
    });
  }, { passive: true });
}

/* ===================== INIT ===================== */
document.addEventListener('DOMContentLoaded', () => {
  aplicarTema(temaInicial());
  renderTitulos3D();
  paralaxeFundo();

  $('#btnTema').addEventListener('click', () => {
    const atual = document.documentElement.getAttribute('data-theme');
    const novo = atual === 'dark' ? 'light' : 'dark';
    animarTrocaTema(novo);
    if (reduzMovimento) {
      aplicarTema(novo);
    } else {
      setTimeout(() => aplicarTema(novo), 350);
    }
    window.skipUI && window.skipUI.toast(novo === 'dark' ? 'Tema escuro ativado' : 'Tema claro ativado');
  });
  $('#btnModoChat').addEventListener('click', () => {
    setModo('chat');
    $('#tvPanel').classList.remove('open');
    $('#tvScrim').classList.remove('open');
  });
  $('#btnModoTV').addEventListener('click', () => {
    setModo('tv');
    window.skipUI && window.skipUI.toast('Modo televisão ativado');
  });

  const sl = $('#delaySlider');
  const sel = $('#velocidadeSelect');
  const rotulo = (s) => (s === 0 ? 'Instantâneo' : `${s} segundo${s > 1 ? 's' : ''}`);
  const aplicarDelay = (s) => {
    estado.delaySeg = s;
    sl.value = s;
    sel.value = s;
    $('#delayValor').textContent = 'Atual: ' + rotulo(s);
  };
  const painel = $('#tvPanel');
  const scrim = $('#tvScrim');
  const btnCfg = $('#btnTvConfig');
  const abrirTv = () => {
    painel.classList.add('open');
    scrim.classList.add('open');
    painel.setAttribute('aria-hidden', 'false');
    btnCfg.setAttribute('aria-expanded', 'true');
    setTimeout(() => $('#btnTvFechar').focus(), 50);
  };
  const fecharTv = () => {
    painel.classList.remove('open');
    scrim.classList.remove('open');
    painel.setAttribute('aria-hidden', 'true');
    btnCfg.setAttribute('aria-expanded', 'false');
    btnCfg.focus();
  };
  btnCfg.addEventListener('click', () => (painel.classList.contains('open') ? fecharTv() : abrirTv()));
  $('#btnTvFechar').addEventListener('click', fecharTv);
  scrim.addEventListener('click', fecharTv);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && painel.classList.contains('open')) fecharTv();
  });
  sl.addEventListener('input', () => aplicarDelay(parseInt(sl.value, 10)));
  sel.addEventListener('change', () => aplicarDelay(parseInt(sel.value, 10)));
  aplicarDelay(0);

  campo.addEventListener('input', atualizarBotao);
  campo.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      $('#formEnvio').requestSubmit();
    }
  });
  $('#formEnvio').addEventListener('submit', enviar);
  atualizarBotao();

  sincronizar(true);
  setInterval(() => sincronizar(false), 4000);

  try {
    const m = localStorage.getItem('ca_modo');
    if (m === 'tv') setModo('tv');
  } catch (e) {}
});
</script>
</body>
</html>
