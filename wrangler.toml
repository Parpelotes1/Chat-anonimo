# ============================================================
# wrangler.toml — Chat Anonimo
# ============================================================

# Nome do Worker (aparece no painel e na URL *.workers.dev)
name = "chat-anonimo"

# Arquivo de entrada do Worker (módulo ES)
main = "src/index.js"

# Data de compatibilidade
compatibility_date = "2025-11-01"

# ------------------------------------------------------------
# Banco de dados D1
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "comentario-anonimo-db"
database_id = "24228015-0b21-4c9f-8c2d-a2897ac74b26"

# ------------------------------------------------------------
# Assets estáticos
# ------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"

# ------------------------------------------------------------
# Observability — logs persistentes para diagnóstico
# ------------------------------------------------------------
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
